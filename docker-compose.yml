services:
  scheduler:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: codity-scheduler
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      - NODE_ENV=production
      - PORT=4000
      - JWT_SECRET=codity-production-secret-jwt-key-2026
    volumes:
      - scheduler_data:/app/data
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:4000/health"]
      interval: 15s
      timeout: 5s
      retries: 3

volumes:
  scheduler_data:
    driver: local
